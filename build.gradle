    'JsonSchemaDeserializeConsumerToJsonNode':'com.solace.samples.jakarta.messaging.features.serdes.jsonschema.JsonSchemaDeserializeConsumerToJsonNode',
    'JsonSchemaDeserializeConsumerToPojo':'com.solace.samples.jakarta.messaging.features.serdes.jsonschema.JsonSchemaDeserializeConsumerToPojo',
    'JsonSchemaSerdesRequestor':'com.solace.samples.jakarta.messaging.features.serdes.jsonschema.JsonSchemaSerdesRequestor',
    'JsonSchemaSerdesReplier':'com.solace.samples.jakarta.messaging.features.serdes.jsonschema.JsonSchemaSerdesReplier',
]

scripts.each() { scriptName, className ->
        def t = tasks.create(name: scriptName+'StartScript', type: CreateStartScripts) {
        mainClass = className
        applicationName = scriptName
        outputDir = new File(project.buildDir, 'scripts')
        classpath = jar.outputs.files + project.configurations.runtimeClasspath
    }
    applicationDistribution.into("bin") {
        from(t)
        fileMode = 0755
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    //createAllStartScripts.dependsOn(t)
}

installDist {
    destinationDir = new File(project.buildDir, 'staged')
}

assemble.dependsOn installDist
