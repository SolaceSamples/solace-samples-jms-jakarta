    'HelloWorldJmsJsonSchemaSerde':'com.solace.samples.jakarta.messaging.features.serdes.jsonschema.HelloWorldJmsJsonSchemaSerde',
    'HelloWorldJmsAvroSerde':'com.solace.samples.jakarta.messaging.features.serdes.avro.HelloWorldJmsAvroSerde',
    'AvroSerializeProducer':'com.solace.samples.jakarta.messaging.features.serdes.avro.AvroSerializeProducer',
    'AvroSerializeProducerSpecificRecord':'com.solace.samples.jakarta.messaging.features.serdes.avro.AvroSerializeProducerSpecificRecord',
